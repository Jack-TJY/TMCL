[workspace]
resolver = "3"
members = [
    "core/auth",
    "core/common",
    "core/game",
    "core/instance",
    "core/java",
    "core/launch",
    "core/loader",
    "core/net",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Jack-TJY/TMCL"
publish = false

[workspace.dependencies]
embed-resource = "3.0"
md-5 = "0.11"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "native-tls", "system-proxy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ts-rs = { version = "12.0", features = ["uuid-impl"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
