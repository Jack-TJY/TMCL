name: 问题反馈 / Bug report
description: 报告启动器的错误或异常行为
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有相同 Issue。请勿在日志或截图中包含访问令牌、邮箱等隐私信息。
        TMCL 是非官方启动器，与 Mojang Studios、Microsoft 无关。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TMCL 版本
      placeholder: 例如 0.1.0 或提交哈希
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: 游戏版本与加载器
      placeholder: 例如 1.20.1 + Fabric 0.16.5；与游戏无关可留空
  - type: dropdown
    id: module
    attributes:
      label: 相关模块（可选）
      options:
        - 不确定
        - 下载 / 版本安装
        - Java
        - 账号登录
        - 实例管理
        - 启动
        - 加载器
        - 整合包 / 资源
        - 皮肤
        - 设置同步
        - P2P 联机
        - 樱花穿透
        - 种子地图
        - 崩溃分析
        - 界面
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 启动器日志或游戏日志的相关片段（已脱敏）
      render: text
