name: 问题反馈 / Bug report
description: 报告启动器的错误或异常行为
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有相同 Issue。请勿在日志或截图中包含访问令牌、邮箱等隐私信息。
        TMCL 是非官方启动器，与 Mojang Studios、Microsoft 无关。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TMCL 版本
      placeholder: 例如 0.2.0-beta.1 或提交哈希
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: 游戏版本与加载器
      placeholder: 例如 1.20.1 + Fabric 0.16.5；与游戏无关可留空
  - type: dropdown
    id: module
    attributes:
      label: 相关模块（可选）
      options:
        - 不确定
        - 下载 / 版本安装
        - Java
        - 账号登录
        - 实例管理
        - 启动
        - 加载器
        - 整合包 / 资源
        - 皮肤
        - 设置同步
        - P2P 联机
        - 樱花穿透
        - 种子地图
        - 崩溃分析
        - 界面
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 启动器日志或游戏日志的相关片段（已脱敏）
      render: text
  - type: markdown
    attributes:
      value: |
        **诊断信息包 / Diagnostics bundle**：在 TMCL 的“设置 → 存储 → 导出诊断信息”中导出一个 zip，直接拖到下方“附件”框里上传。
        包里有启动器日志（最近 7 天）、系统信息、实例列表与 Java 列表；令牌、玩家名、玩家 UUID、账号 ID、路径中的用户名和邮箱都已替换。上传前可以解压检查。
        In TMCL, open Settings → Storage → Export diagnostics, then drag the zip into the attachments box below. Tokens, player names, UUIDs, account IDs, user names in paths and emails are removed.
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息包 / Diagnostics bundle
      description: 拖入导出的 zip 文件（可选，但能大大加快排查）
      placeholder: 把 tmcl-diagnostics-*.zip 拖到这里
