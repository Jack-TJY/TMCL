# 手动触发或推送 v* tag 时在三平台出安装包，产物上传为 workflow artifact。
# 发布到 GitHub Releases 与更新签名在 M1-16 中接入。
# Windows 代码签名走 SignPath（docs/CODE_SIGNING.md）：只在推送 v* tag 且配置了
# SIGNPATH_API_TOKEN Secret 与 SIGNPATH_ORGANIZATION_ID 变量时提交签名请求，
# 每次都要维护者在 SignPath 上手动批准；没配置时照旧出未签名的安装包。
# 本文件是受保护文件（AGENTS.md §5.1），修改需维护者同意。
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Secret 不能直接写在步骤的 if 里，先在这里算出是否启用 SignPath。
  SIGNPATH_ENABLED: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: tmcl-windows
            bundles: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - os: macos-latest
            artifact: tmcl-macos
            bundles: |
              target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            artifact: tmcl-linux
            bundles: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 构建期密钥只在这里注入（AGENTS.md §11）。fork 的 PR 或未配置 Secret 时为空，
      # 构建照常通过，微软登录处于禁用状态、CurseForge 来源隐藏。
      - uses: tauri-apps/tauri-action@v0
        env:
          TMCL_MS_CLIENT_ID: ${{ secrets.TMCL_MS_CLIENT_ID }}
          TMCL_CURSEFORGE_API_KEY: ${{ secrets.TMCL_CURSEFORGE_API_KEY }}
        with:
          tauriScript: pnpm tauri

      - name: Upload bundles
        if: runner.os != 'Windows' || env.SIGNPATH_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

      # ---- Windows 代码签名（SignPath）----
      # 上传的 zip 里只放 NSIS 安装包，结构要和 .signpath/artifact-configuration.xml 一致。
      - name: Upload unsigned installer for signing
        id: upload-unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 等待维护者在 SignPath 上批准，最多等 1 小时；超时则本步骤失败，未签名包仍保留在上一步的 artifact 里。
      - name: Submit signing request to SignPath
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'TMCL' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Upload signed installer
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: signed/*.exe
          if-no-files-found: error
