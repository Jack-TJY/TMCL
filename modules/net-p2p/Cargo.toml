tmcl-net = { path = "../../core/net" }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tmcl-net = { path = "../../core/net", features = ["test-util"] }
