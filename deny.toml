# cargo-deny 配置：许可证、安全公告、重复依赖与依赖来源检查。
# 本文件是受保护文件（AGENTS.md §5.1），修改需维护者同意。
# 文档：https://embarkstudios.github.io/cargo-deny/

[graph]
# 只检查实际发布的三个平台，避免其他平台专用依赖带来噪音。
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
# 只对工作区直接依赖报告“无人维护”；传递依赖（如 Tauri 在 Linux 上依赖的 gtk-rs 3）由上游负责。
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
version = 2
# 必须与 GPL-3.0 兼容（AGENTS.md §14）。新增条目需在 PR 中说明理由。
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# 工作区内部 crate 均为 publish = false，许可证由根 LICENSE 统一声明。
ignore = true

[bans]
# Tauri 依赖树中存在较多重复版本，先只提示不拦截。
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
