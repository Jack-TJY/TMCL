[package]
name = "tmcl-launch"
description = "TMCL core: 启动参数拼装、进程管理、日志流。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tmcl-common = { path = "../common" }
tmcl-game = { path = "../game" }
tmcl-instance = { path = "../instance" }
tmcl-java = { path = "../java" }
tmcl-loader = { path = "../loader" }
tmcl-net = { path = "../net" }
tokio = { workspace = true, features = ["process", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tmcl-auth = { path = "../auth" }
tokio = { workspace = true, features = ["process", "time", "macros", "rt-multi-thread"] }
