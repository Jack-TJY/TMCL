# cargo-about 配置，由 scripts/gen-licenses.mjs 调用（M1-16）。
# accepted 与 deny.toml 的 [licenses] allow 保持一致；targets 与 deny.toml 的 [graph] 一致。
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
# 只列出随安装包分发的代码。
ignore-build-dependencies = true
ignore-dev-dependencies = true
# 工作区内部 crate 以根 LICENSE（GPL-3.0）发布。
private = { ignore = true }
