[package]
name = "tmcl-app"
description = "TMCL application shell: Tauri commands, state, events and bundling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tmcl_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tmcl"
path = "src/main.rs"

[build-dependencies]
embed-resource = { workspace = true }
tauri-build = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tmcl-auth = { path = "../core/auth" }
tmcl-common = { path = "../core/common" }
tmcl-game = { path = "../core/game" }
tmcl-instance = { path = "../core/instance" }
tmcl-java = { path = "../core/java" }
tmcl-launch = { path = "../core/launch" }
tmcl-loader = { path = "../core/loader" }
tmcl-net = { path = "../core/net" }
tmcl-p2p = { path = "../modules/net-p2p" }
tmcl-resources = { path = "../modules/resources" }
tmcl-sakura = { path = "../modules/net-sakura" }
tmcl-skin = { path = "../modules/skin" }
tmcl-sync = { path = "../modules/sync" }
tokio = { workspace = true, features = ["net", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
tmcl-net = { path = "../core/net", features = ["test-util"] }
uuid = { workspace = true }
zip = { workspace = true }
